# railway needs node as well to build the frontend
providers = ["python", "node"]

[variables]
NIXPACKS_NODE_VERSION = "22"  # vite 7 and tailwind 4 need node 20+, nixpacks defaults to 18
ELECTRON_SKIP_BINARY_DOWNLOAD = "1"

[phases.build]
cmds = ["npm ci", "npm run build"]

[start]
cmd = "gunicorn --chdir backend --bind 0.0.0.0:${PORT:-8000} wsgi:app"
