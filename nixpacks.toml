# railway needs node as well to build the frontend
providers = ["python", "node"]

[variables]
NIXPACKS_NODE_VERSION = "22"  # vite 7 and tailwind 4 need node 20+, nixpacks defaults to 18
ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
# skip package install scripts. electron's one downloads the desktop app, which
# the website doesn't need and which breaks in railway's build.
# (npm run build still runs, npm only skips install hooks)
NPM_CONFIG_IGNORE_SCRIPTS = "true"

[phases.build]
# nixpacks already runs npm ci in its install step, no need to do it twice
cmds = ["npm run build"]

[start]
cmd = "gunicorn --chdir backend --bind 0.0.0.0:${PORT:-8000} wsgi:app"
